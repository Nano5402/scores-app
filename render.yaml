services:
  - type: web
    runtime: static
    name: scores-app
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      # Vite injects this at build time. Set it to https://<your-api>.onrender.com/api.
      - key: VITE_API_URL
        sync: false
